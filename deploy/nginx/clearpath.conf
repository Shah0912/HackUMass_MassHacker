# nginx site for ClearPath on a VPS.
# Install: copy to /etc/nginx/sites-available/clearpath, symlink into sites-enabled,
# then `nginx -t && systemctl reload nginx`. Remove /etc/nginx/sites-enabled/default first.
# No domain yet: this answers on the server's IP over plain HTTP.
# Adding a domain later: point its A record at the IP, set `server_name yourdomain.com;`,
# reload nginx, then `certbot --nginx -d yourdomain.com` to add HTTPS.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/clearpath/dist;
    index index.html;

    # Pasted notes are capped well below this in the app; matches the API server's limit.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: proxied to the Node server (server/index.ts), bound to localhost only.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Extraction can take a while on long notes.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Hashed build assets never change; cache them for a long time.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: client-side routes (e.g. /review) load index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
